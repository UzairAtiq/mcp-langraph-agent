<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Connected — Post Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #E5E5E5;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0A0A0A;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #0A0A0A;
      color: #FFFFFF;
      border-radius: 32px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .success-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      color: #22C55E;
    }
    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .page-sub {
      font-size: 13px;
      color: #A3A3A3;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .info-grid {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
    }
    .info-row:last-child {
      border-bottom: none;
      padding-bottom: 4px;
    }
    .info-label {
      color: #737373;
      font-weight: 500;
    }
    .info-value {
      color: #E5E5E5;
      font-weight: 600;
      font-family: ui-monospace, monospace;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #FACC15;
      color: #0A0A0A;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.15s ease;
      width: 100%;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #EAB308;
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <div class="card" id="cb-card">
    <div class="success-icon">
      <i data-lucide="check" style="width:24px;height:24px"></i>
    </div>
    <h1 class="page-title">LinkedIn Connected</h1>
    <p class="page-sub">OAuth tokens saved successfully. Token auto-refresh is active.</p>

    <div class="info-grid">
      <div class="info-row">
        <span class="info-label">User</span>
        <span class="info-value">{{USER_NAME}}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Person URN</span>
        <span class="info-value">{{PERSON_URN}}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Expires In</span>
        <span class="info-value">{{EXPIRES_IN}} s</span>
      </div>
      <div class="info-row">
        <span class="info-label">Refresh Token</span>
        <span class="info-value">{{REFRESH_STATUS}}</span>
      </div>
    </div>

    <a href="/" class="btn">
      <i data-lucide="arrow-left" style="width:16px;height:16px"></i>
      <span>Back to Dashboard</span>
    </a>
  </div>

  <script>
    if (window.lucide && typeof lucide.createIcons === "function") {
      lucide.createIcons();
    }
  </script>
</body>
</html>
